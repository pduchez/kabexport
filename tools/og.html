<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Hanken+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0;width:1200px;height:630px;background:#1F3B2D;color:#F6EFDF;font-family:"Hanken Grotesk",sans-serif;display:flex;align-items:center;overflow:hidden;position:relative}
.l{padding:0 0 0 80px;width:720px}
.lock{display:flex;align-items:center;gap:18px}.lock svg{width:84px;height:84px}
.lock b{font-family:Fraunces,serif;font-size:56px;letter-spacing:.05em;display:block;line-height:1}.lock small{font-size:15px;letter-spacing:.42em;font-weight:600}
h1{font-family:Fraunces,serif;font-weight:600;font-size:60px;line-height:1.08;margin:48px 0 0}h1 em{font-weight:400;color:#E9B866}
p{font-size:24px;opacity:.85;margin:24px 0 0}
svg.c{position:absolute;right:-40px;top:50px;width:520px}
</style></head><body>
<div class="l"><div class="lock"><svg viewBox="0 0 64 64"><path d="M32 6 54.5 19v26L32 58 9.5 45V19Z" fill="none" stroke="#F6EFDF" stroke-width="3.5" stroke-linejoin="round"/><path d="M24 19v26M24 33 37 20" fill="none" stroke="#F6EFDF" stroke-width="4" stroke-linecap="round"/><path d="M28.5 28.5 40 41q5 5 15 4" fill="none" stroke="#D4922A" stroke-width="4" stroke-linecap="round"/><circle cx="59" cy="45" r="3" fill="#D4922A"/></svg><div><b>KAB</b><small>EXPORT</small></div></div>
<h1>Cardamomo, miel y vainilla <em>orgánicos</em></h1><p>Organic cardamom, honey &amp; vanilla from Central America</p></div>
<svg class="c" id="comb" viewBox="0 0 420 420"></svg>
<script>
function hex(cx,cy,r){var p=[];for(var i=0;i<6;i++){var a=Math.PI/180*(60*i-90);p.push((cx+r*Math.cos(a))+','+(cy+r*Math.sin(a)))}return p.join(' ')}
var c=document.getElementById('comb'),r=34,w=Math.sqrt(3)*r,f={'2,2':1,'3,2':.85,'2,3':.7,'3,3':1,'1,3':.45,'2,4':.9,'3,4':.6,'4,3':.5,'1,2':.3,'2,1':.55,'4,4':.35},h='';
for(var y=0;y<8;y++)for(var x=0;x<7;x++){var cx=30+x*w+(y%2?w/2:0),cy=30+y*r*1.5;if(Math.hypot(cx-210,cy-215)>180)continue;var v=f[x+','+y];
h+=v?'<polygon points="'+hex(cx,cy,r-3)+'" fill="#D4922A" fill-opacity="'+v+'"/>':'<polygon points="'+hex(cx,cy,r-3)+'" fill="none" stroke="rgba(246,239,223,.3)" stroke-width="1.5"/>'}
c.innerHTML=h;
</script></body></html>
